name: Obfuscate and Release Worker

on:
  push:
    branches:
      - main
    paths:
      - '_worker.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install javascript-obfuscator
        run: npm install -g javascript-obfuscator

      - name: Obfuscate _worker.js (Fork-Standard Pipeline)
        run: |
          node -e '
          const fs = require("fs");
          const { execSync } = require("child_process");

          // 1. Read _worker.js and remove BOM if present
          let code = fs.readFileSync("_worker.js", "utf8");
          if (code.charCodeAt(0) === 0xFEFF) {
            code = code.slice(1);
          }

          // 2. Extract Version from code
          const vMatch = code.match(/Version\s*=\s*[\x27\x22]([^\x27\x22]+)[\x27\x22]/i);
          const rawVer = vMatch ? vMatch[1].trim() : new Date().toISOString().slice(0, 10);
          const safeTag = "v" + rawVer.replace(/\s+/g, "_").replace(/:/g, "-");

          fs.appendFileSync(process.env.GITHUB_ENV, "RAW_VERSION=" + rawVer + "\n");
          fs.appendFileSync(process.env.GITHUB_ENV, "RELEASE_TAG=" + safeTag + "\n");
          fs.appendFileSync(process.env.GITHUB_ENV, "RELEASE_TITLE=Release " + rawVer + "\n");

          // 3. Extract top-level imports to prevent V8 syntax errors
          const importRegex = /^import\s+[^;]+from\s+[\x27\x22][^\x27\x22]+[\x27\x22];?/gm;
          const imports = code.match(importRegex) || [];
          const codeWithoutImports = code.replace(importRegex, "");

          fs.mkdirSync("dist", { recursive: true });
          fs.writeFileSync("temp_worker.js", codeWithoutImports, "utf8");

          // 4. Run obfuscator with settings matching edgetunnel forks
          execSync(`javascript-obfuscator temp_worker.js \
            --output dist/_worker.js \
            --compact true \
            --identifier-names-generator hexadecimal \
            --rename-globals false \
            --transform-object-keys false \
            --self-defending false \
            --debug-protection false \
            --control-flow-flattening false \
            --dead-code-injection false \
            --numbers-to-expressions false \
            --split-strings false \
            --string-array true \
            --string-array-threshold 0.75 \
            --string-array-encoding none \
            --string-array-calls-transform false \
            --string-array-rotate false \
            --simplify true`, { stdio: "inherit" });

          // 5. Prepend imports to Line 1 of the output
          const obfuscated = fs.readFileSync("dist/_worker.js", "utf8");
          const finalHeader = imports.length > 0 ? imports.join("\n") + "\n" : "";
          fs.writeFileSync("dist/_worker.js", finalHeader + obfuscated, "utf8");

          if (fs.existsSync("temp_worker.js")) {
            fs.unlinkSync("temp_worker.js");
          }
          console.log("Obfuscation completed successfully.");
          '

      - name: Create or Overwrite Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists. Overwriting asset..."
            gh release upload "$RELEASE_TAG" dist/_worker.js --clobber
          else
            echo "Release $RELEASE_TAG does not exist. Creating new release..."
            gh release create "$RELEASE_TAG" dist/_worker.js \
              --title "$RELEASE_TITLE" \
              --notes "Automated release for version \`$RAW_VERSION\` (Commit \`${{ github.sha }}\`)."
          fi
