name: Build and Release Worker

on:
  push:
    branches:
      - main
    paths:
      - '_worker.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Terser
        run: npm install terser

      - name: Light Obfuscation & Build
        run: |
          node -e '
          const fs = require("fs");
          const { minify } = require("terser");

          async function build() {
            let code = fs.readFileSync("_worker.js", "utf8");

            // Strip UTF-8 BOM if present
            if (code.charCodeAt(0) === 0xFEFF) {
              code = code.slice(1);
            }

            // Extract Version for Release
            const match = code.match(/Version\s*=\s*[\x27\x22]([^\x27\x22]+)[\x27\x22]/i);
            const rawVer = match ? match[1].trim() : new Date().toISOString().slice(0, 10);
            const safeTag = "v" + rawVer.replace(/\s+/g, "_").replace(/:/g, "-");

            fs.appendFileSync(process.env.GITHUB_ENV, "RAW_VERSION=" + rawVer + "\n");
            fs.appendFileSync(process.env.GITHUB_ENV, "RELEASE_TAG=" + safeTag + "\n");
            fs.appendFileSync(process.env.GITHUB_ENV, "RELEASE_TITLE=Release " + rawVer + "\n");

            // Light Obfuscation: Mangle identifiers, strip comments/signatures
            const result = await minify(code, {
              module: true,
              compress: {
                passes: 2,
                drop_console: false,
                drop_debugger: false,
              },
              mangle: {
                toplevel: true,
                reserved: [
                  "fetch",
                  "connect",
                  "scheduled",
                  "tail",
                  "trace",
                  "env",
                  "ctx",
                  "request",
                  "response",
                  "Request",
                  "Response",
                  "WebSocket",
                  "WebSocketPair"
                ]
              },
              format: {
                comments: false,
                ascii_only: false
              }
            });

            if (!fs.existsSync("dist")) {
              fs.mkdirSync("dist", { recursive: true });
            }
            fs.writeFileSync("dist/_worker.js", result.code, "utf8");
            console.log("dist/_worker.js created successfully.");
          }

          build().catch(err => {
            console.error("Build failed:", err);
            process.exit(1);
          });
          '

      - name: Create or Overwrite Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists. Overwriting asset..."
            gh release upload "$RELEASE_TAG" dist/_worker.js --clobber
          else
            echo "Release $RELEASE_TAG does not exist. Creating new release..."
            gh release create "$RELEASE_TAG" dist/_worker.js \
              --title "$RELEASE_TITLE" \
              --notes "Automated release for version \`$RAW_VERSION\` (Commit \`${{ github.sha }}\`)."
          fi
