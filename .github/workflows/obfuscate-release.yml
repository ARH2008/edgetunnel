name: Build, Obfuscate and Release Worker

on:
  push:
    branches:
      - main
    paths:
      - '_worker.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract Version from _worker.js
        id: get_version
        run: |
          node -e "
          const fs = require('fs');
          const content = fs.readFileSync('_worker.js', 'utf8');
          const match = content.match(/const\s+Version\s*=\s*['\"]([^'\"]+)['\"]/i);

          if (match && match[1]) {
            const rawVer = match[1].trim();
            const safeTag = 'v' + rawVer.replace(/\s+/g, '_').replace(/:/g, '-');
            fs.appendFileSync(process.env.GITHUB_ENV, \`RAW_VERSION=\${rawVer}\n\`);
            fs.appendFileSync(process.env.GITHUB_ENV, \`RELEASE_TAG=\${safeTag}\n\`);
            fs.appendFileSync(process.env.GITHUB_ENV, \`RELEASE_TITLE=Release \${rawVer}\n\`);
          } else {
            const fallback = new Date().toISOString().replace(/[:.]/g, '-');
            fs.appendFileSync(process.env.GITHUB_ENV, \`RAW_VERSION=\${fallback}\n\`);
            fs.appendFileSync(process.env.GITHUB_ENV, \`RELEASE_TAG=v\${fallback}\n\`);
            fs.appendFileSync(process.env.GITHUB_ENV, \`RELEASE_TITLE=Release \${fallback}\n\`);
          }
          "

      - name: Install BPB Build Dependencies
        run: npm install esbuild terser

      - name: Build & Obfuscate _worker.js (Exact BPB Pipeline)
        run: |
          node -e "
          import * as esbuild from 'esbuild';
          import { minify } from 'terser';
          import fs from 'fs';

          async function build() {
            // Stage 1: Bundle & Normalize ESM with esbuild (BPB method)
            const bundled = await esbuild.build({
              entryPoints: ['_worker.js'],
              bundle: true,
              format: 'esm',
              target: 'es2022',
              platform: 'browser',
              external: ['cloudflare:sockets'],
              write: false,
            });

            const code = bundled.outputFiles[0].text;

            // Stage 2: Mangle & Obfuscate with Terser (BPB method)
            const result = await minify(code, {
              module: true,
              compress: {
                passes: 2,
                drop_console: false,
                drop_debugger: false,
              },
              mangle: {
                toplevel: true,
                reserved: [
                  'fetch',
                  'connect',
                  'scheduled',
                  'tail',
                  'trace',
                  'env',
                  'ctx',
                  'request',
                  'response',
                  'Request',
                  'Response',
                  'WebSocket',
                  'WebSocketPair'
                ]
              },
              format: {
                comments: false,
                ascii_only: false
              }
            });

            fs.mkdirSync('dist', { recursive: true });
            fs.writeFileSync('dist/_worker.js', result.code);
            console.log('Successfully built and obfuscated dist/_worker.js');
          }

          build().catch(err => {
            console.error(err);
            process.exit(1);
          });
          "

      - name: Create or Overwrite Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists. Overwriting asset..."
            gh release upload "$RELEASE_TAG" dist/_worker.js --clobber
          else
            echo "Release $RELEASE_TAG does not exist. Creating new release..."
            gh release create "$RELEASE_TAG" dist/_worker.js \
              --title "$RELEASE_TITLE" \
              --notes "Automated release for version \`$RAW_VERSION\` (Commit \`${{ github.sha }}\`)."
          fi
