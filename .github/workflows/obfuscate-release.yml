name: Randomize and Release Worker

on:
  push:
    branches:
      - main
    paths:
      - '_worker.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  randomize-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract Version from _worker.js
        run: |
          RAW_VER=$(grep -m1 -oE "Version\s*=\s*['\"][^'\"]+['\"]" _worker.js | sed -E "s/Version\s*=\s*['\"]([^'\"]+)['\"]/\1/" || true)
          if [ -n "$RAW_VER" ]; then
            SAFE_TAG="v$(echo "$RAW_VER" | tr ' :' '_-')"
            echo "RAW_VERSION=$RAW_VER" >> $GITHUB_ENV
            echo "RELEASE_TAG=$SAFE_TAG" >> $GITHUB_ENV
            echo "RELEASE_TITLE=Release $RAW_VER" >> $GITHUB_ENV
          else
            FALLBACK="$(date +'%Y%m%d-%H%M%S')"
            echo "RAW_VERSION=$FALLBACK" >> $GITHUB_ENV
            echo "RELEASE_TAG=v$FALLBACK" >> $GITHUB_ENV
            echo "RELEASE_TITLE=Release $FALLBACK" >> $GITHUB_ENV
          fi

      - name: BPB-Style Randomizer & Signature Mutator
        run: |
          node -e '
          const fs = require("fs");
          const crypto = require("crypto");

          // 1. Read _worker.js and remove BOM
          let code = fs.readFileSync("_worker.js", "utf8");
          if (code.charCodeAt(0) === 0xFEFF) {
            code = code.slice(1);
          }

          // 2. Random helper utilities (mimicking BPB random.go)
          function randString(len) {
            return crypto.randomBytes(Math.ceil(len / 2)).toString("hex").slice(0, len);
          }

          function randInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
          }

          // 3. Generate dynamic junk code block
          const uniqueSalt = randString(32);
          let junkBlock = `\n\n// ================= BPB ANTI-SCANNER SIGNATURE SALT =================\n`;
          junkBlock += `// __CF_HASH_SALT__ = "${uniqueSalt}";\n`;

          const numJunk = randInt(5, 10);
          for (let i = 0; i < numJunk; i++) {
            const funcName = `_0x${randString(6)}`;
            const var1 = `_0x${randString(5)}`;
            const var2 = `_0x${randString(5)}`;
            const val1 = randInt(10000, 999999);
            const val2 = randInt(100, 9999);
            const strVal = randString(randInt(8, 24));

            const junkType = randInt(1, 3);
            if (junkType === 1) {
              junkBlock += `const ${funcName} = function() { let ${var1} = ${val1}; let ${var2} = "${strVal}"; return ${var1} + ${val2}; };\n`;
            } else if (junkType === 2) {
              junkBlock += `const ${funcName} = [${val1}, "${strVal}", 0x${randString(4)}, ${val2}];\n`;
            } else {
              junkBlock += `function ${funcName}() { return (0x${randString(4)} ^ ${val1}) + "${strVal}"; }\n`;
            }
          }

          // 4. Append the randomized block to the worker code
          const randomizedCode = code.trim() + junkBlock;

          // 5. Output file
          if (!fs.existsSync("dist")) {
            fs.mkdirSync("dist", { recursive: true });
          }
          fs.writeFileSync("dist/_worker.js", randomizedCode, "utf8");

          // 6. Calculate & print new SHA-256 for verification
          const hash = crypto.createHash("sha256").update(randomizedCode).digest("hex");
          console.log("Successfully generated randomized worker.");
          console.log("Unique SHA-256 Fingerprint:", hash);
          '

      - name: Create or Overwrite Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists. Overwriting asset..."
            gh release upload "$RELEASE_TAG" dist/_worker.js --clobber
          else
            echo "Release $RELEASE_TAG does not exist. Creating new release..."
            gh release create "$RELEASE_TAG" dist/_worker.js \
              --title "$RELEASE_TITLE" \
              --notes "Automated release for version \`$RAW_VERSION\` with dynamic anti-scanner signature (Commit \`${{ github.sha }}\`)."
          fi
