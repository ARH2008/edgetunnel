name: Build and Release Worker

on:
  push:
    branches:
      - main
    paths:
      - '_worker.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Version from _worker.js
        run: |
          RAW_VER=$(grep -m1 -oE "Version\s*=\s*['\"][^'\"]+['\"]" _worker.js | sed -E "s/Version\s*=\s*['\"]([^'\"]+)['\"]/\1/" || true)
          if [ -n "$RAW_VER" ]; then
            SAFE_TAG="v$(echo "$RAW_VER" | tr ' :' '_-')"
            echo "RAW_VERSION=$RAW_VER" >> $GITHUB_ENV
            echo "RELEASE_TAG=$SAFE_TAG" >> $GITHUB_ENV
            echo "RELEASE_TITLE=Release $RAW_VER" >> $GITHUB_ENV
          else
            FALLBACK="$(date +'%Y%m%d-%H%M%S')"
            echo "RAW_VERSION=$FALLBACK" >> $GITHUB_ENV
            echo "RELEASE_TAG=v$FALLBACK" >> $GITHUB_ENV
            echo "RELEASE_TITLE=Release $FALLBACK" >> $GITHUB_ENV
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build & Light Obfuscate (esbuild)
        run: |
          mkdir -p dist
          npx esbuild _worker.js \
            --bundle \
            --format=esm \
            --target=es2022 \
            --platform=browser \
            --external:cloudflare:sockets \
            --minify \
            --legal-comments=none \
            --outfile=dist/_worker.js

      - name: Create or Overwrite Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists. Overwriting asset..."
            gh release upload "$RELEASE_TAG" dist/_worker.js --clobber
          else
            echo "Release $RELEASE_TAG does not exist. Creating new release..."
            gh release create "$RELEASE_TAG" dist/_worker.js \
              --title "$RELEASE_TITLE" \
              --notes "Automated release for version \`$RAW_VERSION\` (Commit \`${{ github.sha }}\`)."
          fi
